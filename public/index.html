<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SIGNN Ops Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { font-family: Arial; margin:0; display:flex; }
    .sidebar { width:220px; background:#1e293b; color:white; padding:15px; }
    .nav-item { display:block; padding:10px; cursor:pointer; }
    .nav-item:hover { background:#334155; }

    .main { flex:1; padding:20px; }

    /* Modal */
    .modal-bg {
      display:none;
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.5);
      justify-content:center;
      align-items:center;
    }

    .modal {
      background:white;
      padding:20px;
      width:400px;
      border-radius:10px;
    }

    textarea, input {
      width:100%;
      padding:8px;
      margin-top:5px;
    }

    button {
      padding:8px 12px;
      margin-top:10px;
      cursor:pointer;
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h3>SIGNN</h3>

  <div class="nav-item">Dashboard</div>
  <div class="nav-item">Clinics</div>
  <div class="nav-item">Staff</div>

  <div class="nav-item">WA Sessions</div>

  <!-- ✅ NEW -->
  <div class="nav-item" onclick="openTemplateModal()">📝 Reminder Templates</div>

</div>

<!-- MAIN -->
<div class="main">
  <h2>Dashboard</h2>
  <p>Welcome to SIGNN Ops Hub</p>
</div>

<!-- QR MODAL (existing type) -->
<div class="modal-bg" id="qr-modal">
  <div class="modal">
    <h3>Scan QR</h3>
    <img src="/api/qr" width="200">
    <button onclick="closeModal('qr-modal')">Close</button>
  </div>
</div>

<!-- ✅ TEMPLATE MODAL -->
<div class="modal-bg" id="template-modal">
  <div class="modal">
    <h3>Create Reminder Template</h3>

    <label>Message</label>
    <textarea id="template-msg" placeholder="Enter message"></textarea>

    <label>Upload File</label>
    <input type="file" id="template-file">

    <button onclick="saveTemplate()">Save</button>
    <button onclick="closeModal('template-modal')">Cancel</button>
  </div>
</div>

<script>
function openModal(id) {
  document.getElementById(id).style.display = 'flex';
}

function closeModal(id) {
  document.getElementById(id).style.display = 'none';
}

function openTemplateModal() {
  openModal('template-modal');
}

async function saveTemplate() {
  const message = document.getElementById('template-msg').value;
  const file = document.getElementById('template-file').files[0];

  const formData = new FormData();
  formData.append('message', message);
  formData.append('file', file);

  await fetch('/api/template', {
    method: 'POST',
    body: formData
  });

  alert('Template Saved!');
  closeModal('template-modal');
}
</script>

</body>
</html>
